[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmatrix"
version = "0.3.0"
description = "Zero-NumPy matrix package: Python API with a multithreaded C++ backend"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "OpenAI"}
]
keywords = ["matrix", "linear algebra", "cpp", "python", "multithreading"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
